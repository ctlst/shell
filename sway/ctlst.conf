# Package-owned, hardware-neutral CTLST Sway configuration.
# Administrator, device-profile, and user sway.conf files are included later
# by ctlst-session and may override these defaults.

set $mod Mod4
set $ctlst /usr/libexec/ctlst-shell
set $control $ctlst/ctlst-control

font pango:sans-serif 10
default_border normal 3
default_floating_border normal 3
gaps inner 2
gaps outer 2
smart_gaps on
smart_borders on
focus_follows_mouse no
mouse_warping none
floating_modifier $mod normal
tiling_drag disable

# Owned applications provide their own navigation/title; keep normal Sway
# decorations for other applications and their existing window gestures.
for_window [app_id="dev.ctlst.Dialer"] border none
for_window [app_id="dev.ctlst.Messages"] border none
for_window [app_id="dev.ctlst.Settings"] border none
for_window [app_id="dev.ctlst.Weather"] border none

# Do not assume a connector, resolution, scale, or touchscreen.
output * bg #101513 solid_color
input type:keyboard {
    xkb_layout us
    repeat_delay 350
    repeat_rate 35
}
input type:pointer {
    accel_profile adaptive
    natural_scroll enabled
}
seat * hide_cursor 0
xwayland enable

# Core shell processes. Optional keyboard, phone, files, and device services
# are started by their own packages or profile fragments.
exec dbus-update-activation-environment WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP
exec mako --config "$CTLST_GENERATED_DIR/mako"
exec $ctlst/ctlst-component $ctlst/waybar-daemon daemon
exec $ctlst/ctlst-component $ctlst/ctlst-wallpaper apply
exec $ctlst/ctlst-component ctlstshade
exec $ctlst/ctlst-component ctlstaction
exec $ctlst/ctlst-component ctlsthome
exec $ctlst/ctlst-component $ctlst/ctlst-workspaced daemon
exec $ctlst/ctlst-component $ctlst/workspace-card-cache
exec $ctlst/ctlst-component ctlstdock
exec env LD_PRELOAD=/usr/lib/libgtk4-layer-shell.so.0 CTLST_DRAWER_RESIDENT=1 $ctlst/ctlst-component $ctlst/ctlstdrawer-ui
exec $ctlst/ctlst-component ctlstoverview
exec $ctlst/ctlst-component ctlst-gestured
exec $ctlst/ctlst-component $ctlst/floating-window-guard daemon

bindsym $mod+Return exec $ctlst/app-run role terminal
bindsym $mod+d exec $control drawer
bindsym $mod+Home exec $control home
bindsym $mod+Tab exec $control next
bindsym $mod+Shift+Tab exec $control prev
bindsym $mod+o exec $control overview
bindsym $mod+a exec $control shade
bindsym $mod+BackSpace exec $control back
bindsym $mod+Shift+q kill
bindsym $mod+Shift+c exec ctlst-session reload
bindsym $mod+Shift+e exec $ctlst/session-menu
bindsym $mod+Escape exec $ctlst/ctlstlock lock
bindsym $mod+Shift+s exec $ctlst/ctlstshade show
bindsym Print exec $ctlst/screenshot

bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+Up focus up
bindsym $mod+k exec $control keyboard
bindsym $mod+l focus right
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+space exec $ctlst/toggle-float-safe

set $home 1
bindsym $mod+0 workspace number $home
bindsym $mod+1 workspace number 2
bindsym $mod+2 workspace number 3
bindsym $mod+3 workspace number 4
bindsym $mod+4 workspace number 5
workspace $home
