[package.ctlst-shell]
required = true
components = [
  "session",
  "sway-session-config",
  "ctlst-gestured",
  "ctlstaction",
  "ctlstdock",
  "ctlsthome",
  "ctlstlock",
  "ctlstoverview",
  "ctlstshade",
  "drawer",
  "waybar-integration",
  "workspace-manager",
  "widget-authoring",
  "themes",
  "notification-integration",
]

[package.ctlst-shell-keyboard]
required = false
components = ["keyboard-integration", "wvkbd-swaytouch"]

[package.ctlst-shell-files]
required = false
components = ["ctlstfiles", "file-portal"]

[package.ctlst-shell-phone]
required = false
components = ["ctlstdialer", "ctlstmessages", "ctlst-smsd", "telephony-adapters"]

[package.ctlst-shell-gamepad]
required = false
components = ["ctlstpad", "emulator-integration"]

[package.ctlst-shell-agent-dev]
required = false
components = ["agent-builder", "agent-development-harness"]

[excluded]
components = [
  "bonito-camera-integration",
  "bonito-modem-integration",
  "bonito-audio-integration",
  "boot-management",
  "motion-lab",
  "reference-device-snapshots",
]
