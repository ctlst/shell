# Copy to ~/.config/ctlst/battery.conf. Restart the recorder after changes.
[battery]
# Sampling does not wake a suspended device. Allowed: 30–600 seconds.
interval_seconds = 60
# Automatic pruning only affects this recorder's own history. Allowed: 1–90 days.
retention_days = 30
# Store process names and CPU time (not command lines, window titles or content).
# CPU activity is not per-app battery energy. false disables future process records.
process_activity = true
# auto selects the first system battery by name; never sums multiple batteries.
# Set an exact /sys/class/power_supply name on multi-battery devices.
device = auto
