# Generic installs do not impose Pixel-sized cgroup limits. Values ending in
# `_bytes` are literal byte counts; 0 means no CTLST limit is applied.
[lifecycle]
# Freezing and pressure eviction are not implemented in the portable runtime.
# These switches must stay false; unsupported true values fail validation.
enabled = false
manage_flatpak = false
freeze_after_seconds = 20

[app]
# Nonzero limits apply to newly launched CTLST scopes and require systemd.
# Zero adds no CTLST limit; ancestor/system limits still apply. Literal bytes.
memory_high_bytes = 0
memory_max_bytes = 0
memory_swap_max_bytes = 0

[terminal]
memory_high_bytes = 0
memory_max_bytes = 0
memory_swap_max_bytes = 0

[pressure]
enabled = false
available_low_bytes = 0
available_emergency_bytes = 0
swap_used_low_bytes = 0
swap_used_percent_emergency = 0

[compositor]
restart_rss_bytes = 0
restart_swap_bytes = 0
