# Override in $XDG_CONFIG_HOME/ctlst/notes.conf (normally ~/.config/ctlst/notes.conf).
# Reloaded automatically; no rebuild/restart.
[notes]
# Relative to your ctlst configuration directory. Never overwritten.
file = notes.txt
# JSON arguments; the note's absolute path is appended. No shell evaluation.
# [] selects installed text/plain handler, GUI editor, then Foot+nano/nvim/vi.
# Examples: ["gnome-text-editor"] or ["foot", "-e", "nvim"]
editor = []
