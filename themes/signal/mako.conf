font=Noto Sans 10
background-color=#131617fa
text-color=#f2eee5ff
border-color=#ff9852ff
border-size=2
border-radius=2
width=360
height=120
margin=8
padding=12
default-timeout=5000
max-visible=3
anchor=top-right
layer=overlay
on-notify=exec /home/user/.local/share/sway-touch/scripts/notification-history capture "$id"

[category=x-kde.incoming-call]
default-timeout=0
ignore-timeout=1
border-color=#ffd166ff
border-size=4
format=<b>%s</b>\n%b\nTap to answer
on-touch=exec /home/user/.local/share/sway-touch/scripts/incoming-call-action accept
on-button-left=exec /home/user/.local/share/sway-touch/scripts/incoming-call-action accept
on-button-right=exec /home/user/.local/share/sway-touch/scripts/incoming-call-action reject

[category=x-ctlst.incoming-call]
default-timeout=0
ignore-timeout=1
border-color=#ffd166ff
border-size=4
format=<b>%s</b>\n%b\nTap to answer
on-touch=invoke-action answer
on-button-left=invoke-action answer
on-button-right=invoke-action decline

[category=x-ctlst.active-call]
default-timeout=0
ignore-timeout=1
border-color=#ff9852ff
border-size=4
format=<b>%s</b>\n%b
on-touch=exec /home/user/.local/share/sway-touch/scripts/incoming-call-action open
on-button-left=exec /home/user/.local/share/sway-touch/scripts/incoming-call-action open
on-button-right=exec /home/user/.local/share/sway-touch/scripts/incoming-call-action hangup

[app-name=Spacebar]
on-notify=exec /home/user/.local/share/sway-touch/scripts/incoming-message-feedback "$id"
on-touch=exec /home/user/.local/share/sway-touch/scripts/notification-history reply-mako "$id"
on-button-left=exec /home/user/.local/share/sway-touch/scripts/notification-history reply-mako "$id"
